<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vyshnavi | To-Do List</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Header -->
        <header class="header">
            <div>
                <p class="small-title">PRODUCTIVITY APP</p>
                <h1>My <span>To-Do List</span></h1>
                <p class="subtitle">Organize your tasks and stay productive.</p>
            </div>

            <button id="themeBtn" class="theme-btn" title="Toggle Dark Mode">
                <i class="fa-solid fa-moon"></i>
            </button>
        </header>

        <!-- Summary -->
        <section class="summary">

            <div class="summary-card">
                <div class="summary-icon total">
                    <i class="fa-solid fa-list-check"></i>
                </div>
                <div>
                    <p>Total Tasks</p>
                    <h2 id="totalTasks">0</h2>
                </div>
            </div>

            <div class="summary-card">
                <div class="summary-icon pending">
                    <i class="fa-solid fa-clock"></i>
                </div>
                <div>
                    <p>Pending</p>
                    <h2 id="pendingTasks">0</h2>
                </div>
            </div>

            <div class="summary-card">
                <div class="summary-icon completed">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
                <div>
                    <p>Completed</p>
                    <h2 id="completedTasks">0</h2>
                </div>
            </div>

        </section>

        <!-- Add Task -->
        <section class="add-task-card">

            <h2>
                <i class="fa-solid fa-plus"></i>
                Add New Task
            </h2>

            <div class="task-form">

                <input type="text"
                    id="taskInput"
                    placeholder="What needs to be done?">

                <select id="categoryInput">
                    <option value="Personal">Personal</option>
                    <option value="Work">Work</option>
                    <option value="Study">Study</option>
                    <option value="Other">Other</option>
                </select>

                <select id="priorityInput">
                    <option value="Low">Low Priority</option>
                    <option value="Medium" selected>Medium Priority</option>
                    <option value="High">High Priority</option>
                </select>

                <input type="date" id="dateInput">

                <button id="addBtn" class="add-btn">
                    <i class="fa-solid fa-plus"></i>
                    Add Task
                </button>

            </div>

            <p id="errorMessage"></p>

        </section>

        <!-- Search and Filter -->
        <section class="controls">

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text"
                    id="searchInput"
                    placeholder="Search tasks...">
            </div>

            <select id="filterInput">
                <option value="all">All Tasks</option>
                <option value="pending">Pending</option>
                <option value="completed">Completed</option>
            </select>

            <select id="categoryFilter">
                <option value="all">All Categories</option>
                <option value="Personal">Personal</option>
                <option value="Work">Work</option>
                <option value="Study">Study</option>
                <option value="Other">Other</option>
            </select>

        </section>

        <!-- Task List -->
        <section class="task-section">

            <div class="task-heading">
                <h2>My Tasks</h2>

                <button id="clearCompletedBtn">
                    Clear Completed
                </button>
            </div>

            <div id="taskList" class="task-list">
                <!-- Tasks will appear here -->
            </div>

            <div id="emptyMessage" class="empty-message">
                <i class="fa-solid fa-clipboard-check"></i>
                <h3>No tasks found</h3>
                <p>Add a task to get started.</p>
            </div>

        </section>

        <footer>
            <p>Designed & Developed by Vyshnavi</p>
            <p>© 2026 To-Do List App</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
