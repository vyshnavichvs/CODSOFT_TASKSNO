<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vyshnavi | Expense Tracker</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- HEADER -->
        <header class="header">

            <div>
                <p class="small-title">PERSONAL FINANCE</p>

                <h1>Expense <span>Tracker</span></h1>

                <p class="subtitle">
                    Track your income and expenses with ease.
                </p>
            </div>

            <button id="themeBtn" class="theme-btn">
                <i class="fa-solid fa-moon"></i>
            </button>

        </header>


        <!-- SUMMARY CARDS -->
        <section class="summary">

            <div class="summary-card balance-card">

                <div class="summary-icon balance-icon">
                    <i class="fa-solid fa-wallet"></i>
                </div>

                <div>
                    <p>Balance</p>
                    <h2 id="balance">₹0.00</h2>
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-icon income-icon">
                    <i class="fa-solid fa-arrow-trend-up"></i>
                </div>

                <div>
                    <p>Total Income</p>
                    <h2 id="totalIncome">₹0.00</h2>
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-icon expense-icon">
                    <i class="fa-solid fa-arrow-trend-down"></i>
                </div>

                <div>
                    <p>Total Expenses</p>
                    <h2 id="totalExpense">₹0.00</h2>
                </div>

            </div>

        </section>


        <!-- ADD TRANSACTION -->
        <section class="transaction-card">

            <h2>
                <i class="fa-solid fa-plus"></i>
                Add Transaction
            </h2>

            <div class="transaction-form">

                <input
                    type="text"
                    id="description"
                    placeholder="Transaction description">


                <input
                    type="number"
                    id="amount"
                    placeholder="Amount"
                    min="0">


                <select id="type">

                    <option value="expense">
                        Expense
                    </option>

                    <option value="income">
                        Income
                    </option>

                </select>


                <select id="category">

                    <option value="Food">
                        Food
                    </option>

                    <option value="Transport">
                        Transport
                    </option>

                    <option value="Shopping">
                        Shopping
                    </option>

                    <option value="Bills">
                        Bills
                    </option>

                    <option value="Education">
                        Education
                    </option>

                    <option value="Entertainment">
                        Entertainment
                    </option>

                    <option value="Salary">
                        Salary
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <input
                    type="date"
                    id="date">


                <button id="addBtn" class="add-btn">

                    <i class="fa-solid fa-plus"></i>

                    Add Transaction

                </button>

            </div>

            <p id="errorMessage"></p>

        </section>


        <!-- SEARCH AND FILTER -->
        <section class="controls">

            <div class="search-box">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search transactions...">

            </div>


            <select id="typeFilter">

                <option value="all">
                    All Transactions
                </option>

                <option value="income">
                    Income
                </option>

                <option value="expense">
                    Expenses
                </option>

            </select>


            <select id="categoryFilter">

                <option value="all">
                    All Categories
                </option>

                <option value="Food">
                    Food
                </option>

                <option value="Transport">
                    Transport
                </option>

                <option value="Shopping">
                    Shopping
                </option>

                <option value="Bills">
                    Bills
                </option>

                <option value="Education">
                    Education
                </option>

                <option value="Entertainment">
                    Entertainment
                </option>

                <option value="Salary">
                    Salary
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

        </section>


        <!-- TRANSACTION HISTORY -->
        <section class="history-card">

            <div class="history-header">

                <h2>
                    Transaction History
                </h2>

                <button id="clearBtn">
                    Clear All
                </button>

            </div>


            <div id="transactionList">

                <!-- Transactions appear here -->

            </div>


            <div id="emptyMessage" class="empty-message">

                <i class="fa-solid fa-receipt"></i>

                <h3>No transactions yet</h3>

                <p>
                    Add your first income or expense.
                </p>

            </div>

        </section>


        <!-- FOOTER -->

        <footer>

            <p>
                Designed & Developed by Vyshnavi
            </p>

            <p>
                © 2026 Expense Tracker
            </p>

        </footer>

    </div>


    <script src="script.js"></script>

</body>

</html>
